<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGE · Lixeira</title>
<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');
:root{
  --navy-900:#0E1638;--navy-800:#141F4D;--indigo-600:#5B4FE8;--indigo-500:#6E63EE;--indigo-50:#EEECFD;
  --bg:#EEF1F8;--card:#FFFFFF;--border:#E1E4F0;--text:#161A3B;--text-muted:#6A6F94;
  --danger:#DC3630;--danger-50:#FCEAE9;--ok:#1C9A6C;--ok-50:#E7F7F1;--warn:#B4780B;--warn-50:#FBF1E1;
  --radius:14px;--shadow:0 1px 2px rgba(20,25,70,.04), 0 8px 24px -12px rgba(20,25,70,.12);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
h1,h2,.font-display{font-family:'Sora',sans-serif;}
.topbar{
  background:linear-gradient(180deg,var(--navy-800),var(--navy-900));
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 1.5px), linear-gradient(180deg,var(--navy-800),var(--navy-900));
  background-size:14px 14px, auto;color:#fff;padding:22px 28px;display:flex;align-items:center;gap:14px;
  border-bottom:1px solid rgba(255,255,255,.08);min-height:92px;box-sizing:border-box;
}
.back-btn{
  display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;cursor:pointer;
  text-decoration:none;flex-shrink:0;
}
.back-btn svg{width:18px;height:18px;}
.topbar h1{margin:0;font-weight:800;font-size:22px;}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px;}
main{padding:32px 24px 48px;display:flex;justify-content:center;}
.wrap{max-width:960px;width:100%;}
.notice{
  background:var(--indigo-50);border:1px solid #D9D4FB;color:var(--navy-800);border-radius:12px;
  padding:14px 16px;font-size:12.5px;line-height:1.5;margin-bottom:22px;
}
.section-title{
  font-family:'Sora',sans-serif;font-weight:700;font-size:14.5px;color:var(--navy-900);
  margin:26px 0 10px;display:flex;align-items:center;gap:8px;
}
.count-pill{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;background:#F1F2F8;color:var(--text-muted);
  padding:2px 8px;border-radius:100px;
}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.item-row{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--border);
}
.item-row:last-child{border-bottom:none;}
.item-main{flex:1;min-width:0;}
.item-title{font-weight:700;font-size:13.5px;color:var(--navy-900);}
.item-meta{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.item-actions{display:flex;gap:8px;flex-shrink:0;}
.btn-restore{
  background:var(--ok-50);color:var(--ok);border:1px solid #CDEEE0;font-family:'Sora',sans-serif;font-weight:700;
  font-size:12px;padding:8px 14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;
}
.btn-restore:hover{background:#D5F0E4;}
.btn-restore svg{width:13px;height:13px;}
.btn-purge{
  background:none;border:none;color:var(--danger);font-size:11.5px;font-weight:600;cursor:pointer;
  padding:8px 6px;text-decoration:underline;
}
.empty{padding:36px 20px;text-align:center;color:var(--text-muted);font-size:13px;}
.loading{padding:36px 20px;text-align:center;color:var(--text-muted);font-size:13px;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy-900);
  color:#fff;padding:10px 18px;border-radius:9px;font-size:12.5px;opacity:0;transition:.2s ease;pointer-events:none;
  z-index:99998;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="modulo-00.html" title="Voltar ao menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
  </a>
  <img src="assets/logo/logo-white.png" alt="SGE" style="width:34px;height:34px;object-fit:contain;flex-shrink:0;margin-right:2px;">
  <div>
    <h1>Lixeira</h1>
    <div class="topbar-sub">Itens excluídos — restaure ou apague em definitivo</div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="notice">
      Itens excluídos ficam guardados aqui em vez de sumir na hora. Você só pode restaurar ou apagar em definitivo
      itens de setores em que tem permissão de edição (ou se for Administrador).
    </div>
    <div id="conteudo"><div class="loading">Carregando itens excluídos…</div></div>
  </div>
</main>

<div class="toast" id="toast"><span id="toastText"></span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
const GRUPOS = [
  { tabela: 'fichas',              setor: 'arte',        titulo: 'Artes — Fichas',                colunaTitulo: r => r.referencia || '—' },
  { tabela: 'pedidos',             setor: 'estamparia',  titulo: 'Estamparia — Pedidos',           colunaTitulo: r => r.numero || '—' },
  { tabela: 'fornecedores',        setor: 'laboratorio', titulo: 'Laboratório de Tinta — Fornecedores', colunaTitulo: r => r.nome || '—' },
  { tabela: 'produtos',            setor: 'laboratorio', titulo: 'Laboratório de Tinta — Estoque', colunaTitulo: r => r.nome + (r.lote ? ' · lote ' + r.lote : '') },
  { tabela: 'receitas',            setor: 'laboratorio', titulo: 'Laboratório de Tinta — Receitas', colunaTitulo: r => (r.pantone || '—') + ' · ' + (r.referencia || '—') },
  { tabela: 'registros_qualidade', setor: 'qualidade',   titulo: 'Qualidade — Cadastros',          colunaTitulo: r => (r.referencia || '—') + ' · Pedido ' + (r.pedido_numero || '—') }
];

let permissoesPorSetor = {};
let perfilAtual = null;

function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function fmtDataHora(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}

async function carregarPermissoes(){
  perfilAtual = await sgeGetPerfil();
  const setores = ['arte', 'estamparia', 'laboratorio', 'qualidade'];
  const resultados = await Promise.all(setores.map(s => sgePodeEditar(s)));
  setores.forEach((s, i) => { permissoesPorSetor[s] = resultados[i]; });
}

async function carregarGrupo(grupo){
  const { data: rows, error } = await window.sgeSupabase
    .from(grupo.tabela)
    .select('*')
    .not('deletado_em', 'is', null)
    .order('deletado_em', { ascending: false });
  if(error){ console.error('Erro ao carregar lixeira de', grupo.tabela, error); return []; }
  return rows || [];
}

async function iniciar(){
  await sgeRequireLogin();
  await sgeMontarBarraUsuario();
  await carregarPermissoes();

  const conteudo = document.getElementById('conteudo');
  const resultadosPorGrupo = await Promise.all(GRUPOS.map(carregarGrupo));
  const totalItens = resultadosPorGrupo.reduce((s, r) => s + r.length, 0);

  if(totalItens === 0){
    conteudo.innerHTML = '<div class="card"><div class="empty">A lixeira está vazia — nada foi excluído ainda. 🎉</div></div>';
    return;
  }

  conteudo.innerHTML = '';
  GRUPOS.forEach((grupo, i) => {
    const itens = resultadosPorGrupo[i];
    if(itens.length === 0) return;

    const podeGerenciar = permissoesPorSetor[grupo.setor] === true;

    const secTitle = document.createElement('div');
    secTitle.className = 'section-title';
    secTitle.innerHTML = `${escapeHtml(grupo.titulo)} <span class="count-pill">${itens.length}</span>`;
    conteudo.appendChild(secTitle);

    const card = document.createElement('div');
    card.className = 'card';
    itens.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div class="item-main">
          <div class="item-title">${escapeHtml(grupo.colunaTitulo(item))}</div>
          <div class="item-meta">Excluído em ${fmtDataHora(item.deletado_em)}</div>
        </div>
        <div class="item-actions"></div>
      `;
      const actions = row.querySelector('.item-actions');
      if(podeGerenciar){
        const btnRestaurar = document.createElement('button');
        btnRestaurar.className = 'btn-restore';
        btnRestaurar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Restaurar';
        btnRestaurar.addEventListener('click', () => restaurarItem(grupo, item, row));
        actions.appendChild(btnRestaurar);

        if(perfilAtual && perfilAtual.papel === 'admin'){
          const btnPurge = document.createElement('button');
          btnPurge.className = 'btn-purge';
          btnPurge.textContent = 'Apagar em definitivo';
          btnPurge.addEventListener('click', () => apagarDefinitivo(grupo, item, row));
          actions.appendChild(btnPurge);
        }
      } else {
        const aviso = document.createElement('span');
        aviso.style.cssText = 'font-size:11px;color:var(--text-muted);';
        aviso.textContent = 'Sem permissão neste setor';
        actions.appendChild(aviso);
      }
      card.appendChild(row);
    });
    conteudo.appendChild(card);
  });
}

async function restaurarItem(grupo, item, row){
  if(!(await sgeConfirmar('Restaurar este item da lixeira? Ele volta a aparecer normalmente no ' + grupo.titulo.split(' — ')[0] + '.'))) return;

  try{
    if(grupo.tabela === 'receitas'){
      await restaurarReceita(item);
    } else {
      const { error } = await sgeRestaurar(grupo.tabela, item.id);
      if(error) throw error;
    }
    sgeRegistrarAuditoria(grupo.tabela, item.id, 'editar', null, { restaurado: true });
    toast('Item restaurado com sucesso.');
    row.remove();
  }catch(e){
    console.error(e);
    toast('Não foi possível restaurar: ' + sgeMensagemErro(e));
  }
}

// Receitas precisam de um cuidado extra: ao restaurar, é preciso descontar de
// novo do estoque a matéria-prima/coloração que ela usa — checando antes se
// ainda existe estoque suficiente, senão a restauração é bloqueada.
async function restaurarReceita(receita){
  const { data: itens, error: errItens } = await window.sgeSupabase
    .from('receita_itens').select('*').eq('receita_id', receita.id);
  if(errItens) throw errItens;

  const necessarioPorProduto = {};
  (itens || []).forEach(it => {
    necessarioPorProduto[it.produto_id] = (necessarioPorProduto[it.produto_id] || 0) + (parseFloat(it.quantidade) || 0);
  });

  const produtoIds = Object.keys(necessarioPorProduto);
  if(produtoIds.length){
    const { data: produtos, error: errProdutos } = await window.sgeSupabase
      .from('produtos').select('id, nome, quantidade').in('id', produtoIds);
    if(errProdutos) throw errProdutos;

    for(const p of produtos){
      const necessario = necessarioPorProduto[p.id] || 0;
      if((p.quantidade || 0) < necessario){
        throw new Error('Estoque insuficiente de "' + p.nome + '" para restaurar esta receita (disponível: ' + (p.quantidade||0).toFixed(2) + ' kg, necessário: ' + necessario.toFixed(2) + ' kg). Registre entrada de estoque antes de restaurar.');
      }
    }
    // Desconta o estoque de volta, já que a receita volta a ficar ativa
    for(const p of produtos){
      const necessario = necessarioPorProduto[p.id] || 0;
      const { error: errUpd } = await window.sgeSupabase.from('produtos')
        .update({ quantidade: (p.quantidade || 0) - necessario }).eq('id', p.id);
      if(errUpd) throw errUpd;
    }
  }

  const { error } = await sgeRestaurar('receitas', receita.id);
  if(error) throw error;
}

async function apagarDefinitivo(grupo, item, row){
  if(!(await sgeConfirmar('Apagar este item em definitivo? Essa ação NÃO pode ser desfeita — ele não pode mais ser restaurado.'))) return;
  if(!(await sgeConfirmar('Tem mesmo certeza? Confirme mais uma vez para apagar em definitivo.'))) return;

  try{
    const { error } = await window.sgeSupabase.from(grupo.tabela).delete().eq('id', item.id);
    if(error) throw error;
    sgeRegistrarAuditoria(grupo.tabela, item.id, 'excluir', item, null);
    toast('Item apagado em definitivo.');
    row.remove();
  }catch(e){
    console.error(e);
    toast('Não foi possível apagar: ' + sgeMensagemErro(e));
  }
}

function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

iniciar();
</script>

</body>
</html>
