<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGE · Entrar</title>
<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy-900:#0E1638;--navy-800:#141F4D;--indigo-600:#5B4FE8;--indigo-500:#6E63EE;
  --bg:#EEF1F8;--card:#FFFFFF;--border:#E1E4F0;--text:#161A3B;--text-muted:#6A6F94;
  --danger:#DC3630;--danger-50:#FCEAE9;--radius:14px;
  --shadow:0 1px 2px rgba(20,25,70,.04), 0 8px 24px -12px rgba(20,25,70,.12);
}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;background:linear-gradient(180deg,var(--navy-800),var(--navy-900));
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 1.5px), linear-gradient(180deg,var(--navy-800),var(--navy-900));
  background-size:14px 14px, auto;
  font-family:'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;
}
.box{
  background:var(--card);border-radius:var(--radius);box-shadow:0 30px 80px -30px rgba(0,0,0,.5);
  padding:36px 32px;max-width:380px;width:100%;
}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:22px;color:var(--navy-900);margin:0 0 4px;}
.sub{font-size:13px;color:var(--text-muted);margin-bottom:26px;}
label{font-family:'Sora',sans-serif;font-weight:700;font-size:12.5px;color:var(--navy-900);display:block;margin-bottom:6px;}
input{
  width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--border);font-size:14px;
  color:var(--text);margin-bottom:16px;font-family:'Inter',sans-serif;
}
input:focus{outline:2px solid var(--indigo-500);outline-offset:1px;border-color:transparent;}
button{
  width:100%;background:var(--indigo-600);color:#fff;border:none;padding:12px;border-radius:10px;
  font-family:'Sora',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:background .15s ease;
}
button:hover{background:var(--indigo-500);}
button:disabled{opacity:.6;cursor:not-allowed;}
.error{
  background:var(--danger-50);color:var(--danger);border:1px solid #F6D3D1;border-radius:9px;
  padding:10px 12px;font-size:12.5px;margin-bottom:16px;display:none;
}
.error.show{display:block;}
.success{
  background:var(--ok-50, #E7F7F1);color:var(--ok, #1C9A6C);border:1px solid #CDEEE0;border-radius:9px;
  padding:10px 12px;font-size:12.5px;margin-bottom:16px;display:none;
}
.success.show{display:block;}
.foot{text-align:center;margin-top:18px;font-size:11.5px;color:var(--text-muted);}
</style>
</head>
<body>

<div class="box">
  <h1>SGE</h1>
  <div class="sub" id="subText">Entre com seu e-mail e senha cadastrados pelo administrador.</div>
  <div class="error" id="errorBox"></div>
  <div class="success" id="successBox"></div>

  <form id="formLogin">
    <label for="email">E-mail</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="senha">Senha</label>
    <input type="password" id="senha" required autocomplete="current-password">
    <button type="submit" id="btnEntrar">Entrar</button>
  </form>

  <form id="formRecuperar" style="display:none;">
    <label for="emailRecuperar">E-mail cadastrado</label>
    <input type="email" id="emailRecuperar" required autocomplete="username">
    <button type="submit" id="btnRecuperar">Enviar link de redefinição</button>
  </form>

  <div style="text-align:center;margin-top:14px;">
    <a href="#" id="linkEsqueci" style="font-size:12.5px;color:var(--indigo-600);text-decoration:none;font-weight:600;">Esqueci minha senha</a>
    <a href="#" id="linkVoltar" style="font-size:12.5px;color:var(--indigo-600);text-decoration:none;font-weight:600;display:none;">Voltar para o login</a>
  </div>

  <div class="foot">Sistema de Gestão · SGE</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
(async function(){
  // Se já está logado, manda direto para o destino
  const { data } = await window.sgeSupabase.auth.getSession();
  if(data && data.session){
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || 'modulo-00.html';
  }
})();

const form = document.getElementById('formLogin');
const errorBox = document.getElementById('errorBox');
const successBox = document.getElementById('successBox');
const btn = document.getElementById('btnEntrar');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const { error } = await window.sgeSupabase.auth.signInWithPassword({ email, password: senha });
  btn.disabled = false;
  btn.textContent = 'Entrar';
  if(error){
    errorBox.textContent = error.message === 'Invalid login credentials'
      ? 'E-mail ou senha incorretos.'
      : sgeMensagemErro(error);
    errorBox.classList.add('show');
    return;
  }
  const params = new URLSearchParams(window.location.search);
  window.location.href = params.get('next') || 'modulo-00.html';
});

/* ---------------- Esqueci minha senha ---------------- */
const formLogin = document.getElementById('formLogin');
const formRecuperar = document.getElementById('formRecuperar');
const linkEsqueci = document.getElementById('linkEsqueci');
const linkVoltar = document.getElementById('linkVoltar');
const subText = document.getElementById('subText');

linkEsqueci.addEventListener('click', (e) => {
  e.preventDefault();
  formLogin.style.display = 'none';
  formRecuperar.style.display = 'block';
  linkEsqueci.style.display = 'none';
  linkVoltar.style.display = 'inline';
  errorBox.classList.remove('show');
  successBox.classList.remove('show');
  subText.textContent = 'Informe o e-mail cadastrado — vamos enviar um link para você criar uma nova senha.';
});

linkVoltar.addEventListener('click', (e) => {
  e.preventDefault();
  formRecuperar.style.display = 'none';
  formLogin.style.display = 'block';
  linkVoltar.style.display = 'none';
  linkEsqueci.style.display = 'inline';
  errorBox.classList.remove('show');
  successBox.classList.remove('show');
  subText.textContent = 'Entre com seu e-mail e senha cadastrados pelo administrador.';
});

const btnRecuperar = document.getElementById('btnRecuperar');
formRecuperar.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  successBox.classList.remove('show');
  btnRecuperar.disabled = true;
  btnRecuperar.textContent = 'Enviando…';
  const email = document.getElementById('emailRecuperar').value.trim();
  const { error } = await window.sgeSupabase.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/redefinir-senha.html'
  });
  btnRecuperar.disabled = false;
  btnRecuperar.textContent = 'Enviar link de redefinição';
  if(error){
    errorBox.textContent = sgeMensagemErro(error);
    errorBox.classList.add('show');
    return;
  }
  successBox.textContent = 'Se esse e-mail estiver cadastrado, você vai receber um link para redefinir a senha em alguns instantes. Confira também a caixa de spam.';
  successBox.classList.add('show');
  formRecuperar.reset();
});
</script>

</body>
</html>
